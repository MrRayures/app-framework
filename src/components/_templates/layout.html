<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>{{ page_title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="{{ page_desc }}" />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

        <!-- Load CSS -->
        <link rel="stylesheet" type="text/css" href="{{ '/app.css' | path }}" />

        <!-- Custom CSS -->
        {% block custom_css %}{% endblock %}
    </head>

    <body class="{{ body_class }} ">
        <main id="app" class="c-layout">
            {% if header.show %}
                {% include "components/_templates/components/header.html" %}
            {% endif %}
            <!-- //END Header -->
            <div class="c-content {{ content_class }}">{% block page_content %}{% endblock %}</div>
        </main>

        <!--
        <script type="text/javascript" src="{{ '/app.js' | path }}"></script>
        -->
        <!-- Custom JS -->
        {% block custom_js %}{% endblock %}
    </body>
</html>
